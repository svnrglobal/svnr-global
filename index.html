<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/svnr-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVNR Global — AI Client Acquisition & Outreach Infrastructure for Premium Operators</title>

    <!-- Primary SEO -->
    <meta name="description" content="SVNR Global builds bespoke AI-powered outreach systems that bring the right clients to luxury brands, private equity firms, premium real estate, and high-ticket B2B operators. No ads. No referrals. Just results." />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <link rel="canonical" href="https://www.svnrglobal.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SVNR Global — AI Client Acquisition & Outreach Infrastructure" />
    <meta property="og:description" content="Bespoke AI outreach systems for luxury brands, private equity, premium real estate, and high-ticket B2B operators." />
    <meta property="og:url" content="https://www.svnrglobal.com/" />
    <meta property="og:image" content="https://www.svnrglobal.com/og-default.svg" />
    <meta property="og:site_name" content="SVNR Global" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SVNR Global — AI Client Acquisition & Outreach Infrastructure" />
    <meta name="twitter:description" content="Bespoke AI outreach systems for luxury brands, private equity, premium real estate, and high-ticket B2B operators." />
    <meta name="twitter:image" content="https://www.svnrglobal.com/og-default.svg" />

    <!-- Geo & Language -->
    <meta name="geo.region" content="IN-DL" />
    <meta name="geo.placename" content="New Delhi" />
    <meta name="language" content="English" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms detection (hidden, do not remove) -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="url" name="website" />
      <input type="text" name="sector" />
      <textarea name="message"></textarea>
      <input type="hidden" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
