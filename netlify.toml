[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "false"
  PUPPETEER_CACHE_DIR = "/opt/build/cache/puppeteer"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# PROSE assistant API → serverless function (must precede the SPA catch-all)
[[redirects]]
  from = "/api/prose"
  to = "/.netlify/functions/prose"
  status = 200

# Admin grant/revoke access → serverless function
[[redirects]]
  from = "/api/admin-access"
  to = "/.netlify/functions/admin-access"
  status = 200

# SPA fallback (belt-and-suspenders alongside _redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.mux.com https://d8j0ntlcm91z4.cloudfront.net https://*.cloudfront.net; connect-src 'self' https://formspree.io https://ingest.sentry.io https://*.mux.com https://*.cloudfront.net https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
